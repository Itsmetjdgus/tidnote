<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Tidnote</title>
    <meta name="description" content="Write about your day or what's on your mind, with words or a photo. Readers can respond in the comments.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tidnote">
    <meta property="og:description" content="Write about your day or what's on your mind, with words or a photo. Readers can respond in the comments.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <section class="hero">
            <p class="badge" data-i18n="home.badge"></p>
            <h2 data-i18n="home.title"></h2>
            <p class="hero-sub" data-i18n="home.sub"></p>
            <div class="hero-actions">
                <p class="hero-note" data-i18n="home.note"></p>
                <a class="btn" href="blog.html" data-i18n="home.read"></a>
                <a class="btn btn-secondary" id="cta-write" href="login.html" data-i18n="home.start"></a>
            </div>
        </section>

        <section>
            <h3 data-i18n="home.what"></h3>
            <div class="feature-grid">
                <div class="feature">
                    <h4 data-i18n="home.f_write_t"></h4>
                    <p data-i18n="home.f_write_d"></p>
                </div>
                <div class="feature">
                    <h4 data-i18n="home.f_read_t"></h4>
                    <p data-i18n="home.f_read_d"></p>
                </div>
                <div class="feature">
                    <h4 data-i18n="home.f_talk_t"></h4>
                    <p data-i18n="home.f_talk_d"></p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="home.js"></script>
</body>
</html>
