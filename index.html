<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Tidnote</title>
 <meta name="description" data-i18n-content="meta.description" content="Write about your day or what's on your mind, with words or a photo. Readers can respond in the comments.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tidnote">
    <meta property="og:description" content="Write about your day or what's on your mind, with words or a photo. Readers can respond in the comments.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <p class="home-note"><span class="badge" data-i18n="home.badge"></span> <span data-i18n="home.banner"></span></p>

        <form class="search-form" action="index.html" method="get">
            <input type="search" id="search-input" name="q" maxlength="50">
            <button type="submit" data-i18n="blog.search_btn"></button>
        </form>

        <div id="post-list">
            <p data-i18n="common.loading"></p>
        </div>

        <div id="pager" class="pager"></div>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="render.js"></script>
    <script src="feed.js"></script>
</body>
</html>
