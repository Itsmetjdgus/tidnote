<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Tidnote">
    <title data-i18n="title.login">Login - Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 data-i18n="login.title"></h2>
        <form class="write-form" id="login-form">
            <label for="email" data-i18n="login.email"></label>
            <input type="email" id="email" data-i18n-placeholder="login.ph_email" autocomplete="email" required>

            <label for="password" data-i18n="login.password"></label>
            <input type="password" id="password" data-i18n-placeholder="login.ph_password" autocomplete="current-password" required>

            <button type="submit" id="login-btn" data-i18n="login.btn"></button>
            <p class="auth-links"><a href="forgot.html" data-i18n="login.forgot"></a></p>
            <p id="auth-message" class="form-message" role="status"></p>
        </form>

        <p class="auth-links"><span data-i18n="login.new"></span> <button type="button" id="open-signup-btn" class="link-button" data-i18n="login.signup"></button></p>
    </main>
    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2" integrity="sha384-7i/4BYWz4Mn+lJfg2HWfEPfZQ7tmFKF3CTSKlXBpxWjNlLjcg+T6smpHG4gLmU1u" crossorigin="anonymous"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
</body>
</html>
