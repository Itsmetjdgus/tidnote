<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title data-i18n="title.forgot">Forgot password - Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 data-i18n="forgot.title"></h2>
        <form class="write-form">
            <label for="email" data-i18n="login.email"></label>
            <input type="email" id="email" data-i18n-placeholder="login.ph_email">
            <button type="button" id="send-btn" data-i18n="forgot.btn"></button>
            <p id="forgot-message" class="form-message"></p>
        </form>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="forgot.js"></script>
</body>
</html>
