<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Reset password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 data-i18n="reset.title"></h2>
        <p id="reset-info" class="state-message"></p>

        <form class="write-form" id="reset-form" hidden>
            <label for="new-password" data-i18n="pw.new"></label>
            <input type="password" id="new-password" data-i18n-placeholder="reset.ph_new" autocomplete="new-password">

            <label for="confirm-password" data-i18n="pw.confirm"></label>
            <input type="password" id="confirm-password" autocomplete="new-password">

            <button type="button" id="reset-btn" data-i18n="pw.btn"></button>
            <p id="reset-message" class="form-message"></p>
        </form>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="reset.js"></script>
</body>
</html>
