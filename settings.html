<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title data-i18n="title.settings">Settings - Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 data-i18n="settings.title"></h2>
        <p id="settings-error" class="state-message"></p>

        <div class="settings-layout">
            <!-- 1단계: 분류. 폰에서는 분류를 고르면 이 목록이 사라지고 2단계가 보인다 -->
            <nav class="settings-menu" data-i18n-aria-label="settings.menu_label" aria-label="Settings">
                <a href="settings.html?tab=account" data-tab="account" data-i18n="settings.menu_account"></a>
                <a href="settings.html?tab=privacy" data-tab="privacy" data-i18n="settings.menu_privacy"></a>
                <a href="settings.html?tab=activity" data-tab="activity" data-i18n="activity.menu"></a>
                <a href="settings.html?tab=security" data-tab="security" data-i18n="settings.menu_security"></a>
                <a href="settings.html?tab=about" data-tab="about" data-i18n="settings.menu_about"></a>
            </nav>

            <!-- 2단계: 분류 안의 항목 목록(settings-nav.js가 만든다) / 3단계: 항목 하나의 화면 -->
            <div class="settings-content">
                <!-- 계정 -->
                <section id="tab-account" class="post settings-panel" hidden>
                    <div class="settings-item" data-item="nickname" hidden>
                        <h3 data-i18n="settings.nickname_title"></h3>
                        <p class="state-message" data-i18n="settings.nickname_help"></p>
                        <form class="write-form" id="nickname-form">
                            <label for="nickname" data-i18n="settings.nickname_title"></label>
                            <input type="text" id="nickname" maxlength="20" autocomplete="off">
                            <button type="submit" id="nickname-btn" data-i18n="settings.nickname_save"></button>
                            <p id="nickname-message" class="form-message" role="status"></p>
                        </form>
                    </div>
                    <div class="settings-item" data-item="language" hidden>
                        <h3 data-i18n="settings.lang_title"></h3>
                        <p data-i18n="settings.lang_desc"></p>
                        <label class="option">
                            <input type="radio" name="lang" value="ko">
                            <span><strong>한국어</strong></span>
                        </label>
                        <label class="option">
                            <input type="radio" name="lang" value="en">
                            <span><strong>English</strong></span>
                        </label>
                    </div>
                </section>

                <!-- 개인정보 보호 -->
                <section id="tab-privacy" class="post settings-panel" hidden>
                    <div class="settings-item" data-item="visibility" hidden>
                        <h3 data-i18n="settings.privacy_title"></h3>
                        <p id="privacy-status" class="state-message"></p>
                        <div id="privacy-options">
                            <label class="option">
                                <input type="radio" name="privacy" value="public">
                                <span>
                                    <strong data-i18n="settings.public"></strong>
                                    <span data-i18n="settings.public_desc"></span>
                                </span>
                            </label>
                            <label class="option">
                                <input type="radio" name="privacy" value="private">
                                <span>
                                    <strong data-i18n="settings.private"></strong>
                                    <span data-i18n="settings.private_desc"></span><br>
                                    <small data-i18n="settings.private_note"></small>
                                </span>
                            </label>
                            <button type="button" id="privacy-save" data-i18n="settings.save"></button>
                            <p id="privacy-message" class="form-message" role="status"></p>
                        </div>
                    </div>
                    <div class="settings-item" data-item="comments" hidden>
                        <h3 data-i18n="cscope.title"></h3>
                        <p class="state-message" data-i18n="cscope.desc"></p>
                        <div id="cscope-options">
                            <label class="option">
                                <input type="radio" name="cscope" value="everyone">
                                <span><strong data-i18n="cscope.everyone"></strong> <span data-i18n="cscope.everyone_desc"></span></span>
                            </label>
                            <label class="option">
                                <input type="radio" name="cscope" value="followers">
                                <span><strong data-i18n="cscope.followers"></strong> <span data-i18n="cscope.followers_desc"></span></span>
                            </label>
                            <label class="option">
                                <input type="radio" name="cscope" value="off">
                                <span><strong data-i18n="cscope.off"></strong> <span data-i18n="cscope.off_desc"></span></span>
                            </label>
                            <button type="button" id="cscope-save" data-i18n="settings.save"></button>
                            <p id="cscope-message" class="form-message" role="status"></p>
                        </div>
                    </div>
                    <div class="settings-item" data-item="likes" hidden>
                        <h3 data-i18n="likesvis.title"></h3>
                        <p class="state-message" data-i18n="likesvis.desc"></p>
                        <div id="likesvis-options">
                            <label class="option">
                                <input type="radio" name="likesvis" value="public">
                                <span><strong data-i18n="likesvis.public"></strong> <span data-i18n="likesvis.public_desc"></span></span>
                            </label>
                            <label class="option">
                                <input type="radio" name="likesvis" value="private">
                                <span><strong data-i18n="likesvis.private"></strong> <span data-i18n="likesvis.private_desc"></span></span>
                            </label>
                            <button type="button" id="likesvis-save" data-i18n="settings.save"></button>
                            <p id="likesvis-message" class="form-message" role="status"></p>
                        </div>
                    </div>
                    <div class="settings-item" data-item="blocked" hidden>
                        <h3 data-i18n="block.list_title"></h3>
                        <p data-i18n="block.list_desc"></p>
                        <div id="blocked-list"></div>
                        <p id="blocked-message" class="form-message" role="status"></p>
                    </div>
                </section>

                <!-- 내 활동 -->
                <section id="tab-activity" class="post settings-panel" hidden>
                    <div class="settings-item" data-item="liked" hidden>
                        <h3 data-i18n="activity.liked_title"></h3>
                        <p class="state-message" data-i18n="activity.liked_desc"></p>
                        <ul id="liked-list" class="activity-list"></ul>
                        <p id="liked-message" class="form-message" role="status"></p>
                    </div>
                    <div class="settings-item" data-item="hidden" hidden>
                        <h3 data-i18n="activity.hidden_title"></h3>
                        <p class="state-message" data-i18n="activity.hidden_desc"></p>
                        <ul id="hidden-list" class="activity-list"></ul>
                        <p id="hidden-message" class="form-message" role="status"></p>
                    </div>
                    <div class="settings-item" data-item="export" hidden>
                        <h3 data-i18n="export.title"></h3>
                        <p data-i18n="export.desc"></p>
                        <button type="button" id="export-btn" data-i18n="export.btn"></button>
                        <p id="export-message" class="form-message" role="status"></p>
                    </div>
                </section>

                <!-- 보안 -->
                <section id="tab-security" class="post settings-panel" hidden>
                    <div class="settings-item" data-item="password" hidden>
                        <h3 data-i18n="pw.title"></h3>
                        <p data-i18n="pw.desc"></p>
                        <form class="write-form" id="pw-form">
                            <label for="pw-current" data-i18n="pw.current"></label>
                            <input type="password" id="pw-current" autocomplete="current-password">
                            <label for="pw-new" data-i18n="pw.new"></label>
                            <input type="password" id="pw-new" autocomplete="new-password">
                            <label for="pw-again" data-i18n="pw.confirm"></label>
                            <input type="password" id="pw-again" autocomplete="new-password">
                            <label class="check">
                                <input type="checkbox" id="pw-show">
                                <span data-i18n="pw.show"></span>
                            </label>
                            <button type="submit" id="pw-btn" data-i18n="pw.btn"></button>
                            <p id="pw-message" class="form-message" role="status"></p>
                        </form>
                    </div>
                    <div class="settings-item" data-item="sessions" hidden>
                        <h3 data-i18n="sessions.title"></h3>
                        <p data-i18n="sessions.desc"></p>
                        <button type="button" id="logout-all-btn" class="danger-btn" data-i18n="sessions.btn"></button>
                        <p id="logout-all-message" class="form-message" role="status"></p>
                    </div>
                    <div class="settings-item" data-item="delete" hidden>
                        <h3 data-i18n="settings.delete_title"></h3>
                        <p data-i18n="settings.delete_desc"></p>
                        <form class="write-form" id="delete-form">
                            <label for="delete-password" data-i18n="settings.delete_password"></label>
                            <input type="password" id="delete-password" autocomplete="current-password">
                            <label for="delete-confirm" data-i18n="settings.delete_type"></label>
                            <input type="text" id="delete-confirm" autocomplete="off">
                            <button type="submit" id="delete-account-btn" class="danger-btn" data-i18n="settings.delete_btn"></button>
                            <p id="delete-message" class="form-message" role="status"></p>
                        </form>
                    </div>
                </section>

                <!-- 정보 -->
                <section id="tab-about" class="post settings-panel" hidden>
                    <div class="settings-item" data-item="contact" hidden>
                        <h3 data-i18n="settings.about_contact"></h3>
                        <p data-i18n="contact.desc"></p>
                        <p><a href="mailto:Tidnote.contact@gmail.com">Tidnote.contact@gmail.com</a></p>
                    </div>
                    <div class="settings-item" data-item="feedback" hidden>
                        <h3 data-i18n="fb.title"></h3>
                        <p data-i18n="fb.desc"></p>
                        <form class="write-form" id="feedback-form">
                            <label for="fb-kind" data-i18n="fb.kind"></label>
                            <select id="fb-kind">
                                <option value="bug" data-i18n="fb.k_bug"></option>
                                <option value="idea" data-i18n="fb.k_idea"></option>
                                <option value="other" data-i18n="fb.k_other"></option>
                            </select>
                            <label for="fb-message" data-i18n="fb.message"></label>
                            <textarea id="fb-message" rows="5" maxlength="1000"></textarea>
                            <p id="fb-counter" class="state-message"></p>
                            <button type="submit" id="fb-btn" data-i18n="fb.send"></button>
                            <p id="fb-result" class="form-message" role="status"></p>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2" integrity="sha384-7i/4BYWz4Mn+lJfg2HWfEPfZQ7tmFKF3CTSKlXBpxWjNlLjcg+T6smpHG4gLmU1u" crossorigin="anonymous"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="avatar.js"></script> 
    <script src="nav.js"></script>
    <script src="block.js"></script> 
    <script src="settings-nav.js"></script>
    <script src="settings.js"></script>
    <script src="blocked-list.js"></script> 
    <script src="password-change.js"></script>   
    <script src="feedback.js"></script>
    <script src="language-select.js"></script>
    <script src="sessions.js"></script>
    <script src="comment-scope.js"></script>
    <script src="likes-setting.js"></script>
    <script src="activity.js"></script>
    <script src="categories.js"></script>
    <script src="export.js"></script>
</body>
</html>
