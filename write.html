<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title data-i18n="title.write">Write - Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 id="write-heading" data-i18n="write.heading_new"></h2>
        <p class="notice"><span data-i18n="write.notice"></span> <span data-i18n="write.notice_lead"></span><a href="help.html" data-i18n="footer.help"></a><span data-i18n="write.notice_end"></span></p>
        <p id="privacy-note" class="state-message"></p>
        <form class="write-form">
            <label for="title" data-i18n="write.label_title"></label>
            <input type="text" id="title" data-i18n-placeholder="write.ph_title" maxlength="100">

            <label for="category" data-i18n="write.label_category"></label>
            <select id="category"></select>

            <label for="content" data-i18n="write.label_content"></label>
            <textarea id="content" rows="10" data-i18n-placeholder="write.ph_content" maxlength="20000"></textarea>

            <label for="image" data-i18n="write.label_image"></label>
            <input type="file" id="image" accept="image/png,image/jpeg,image/webp">

            <button type="button" id="publish-btn" data-i18n="write.publish"></button>
            <p id="write-message" class="form-message"></p>
        </form>
    </main>

    <footer>
                <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="categories.js"></script>
    <script src="image.js"></script>
    <script src="write.js"></script>
    <script src="write-note.js"></script>
    
</body>
</html>
