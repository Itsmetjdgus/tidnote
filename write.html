<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Tidnote">
    <title data-i18n="title.write">Write - Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 id="write-heading" data-i18n="write.heading_new"></h2>
        <p class="notice"><span data-i18n="write.notice"></span> <span data-i18n="write.notice_lead"></span><a href="help.html" data-i18n="footer.help"></a><span data-i18n="write.notice_end"></span></p>
        <p id="privacy-note" class="state-message"></p>
        <div id="draft-bar" class="notice draft-bar" hidden>
            <span id="draft-text"></span>
            <button type="button" id="draft-load" data-i18n="draft.load"></button>
            <button type="button" id="draft-discard" class="secondary" data-i18n="draft.discard"></button>
        </div>
        <section id="draft-panel" class="draft-panel" hidden aria-labelledby="draft-panel-title">
            <div class="draft-panel-head">
                <h3 id="draft-panel-title" data-i18n="draft.list_title"></h3>
                <button type="button" id="draft-panel-close" class="icon-btn" data-i18n-aria-label="common.close">×</button>
            </div>
            <p class="state-message" data-i18n="draft.list_note"></p>
            <ul id="draft-list" class="draft-list"></ul>
        </section>
        <form class="write-form">
            <label for="title" data-i18n="write.label_title"></label>
            <input type="text" id="title" data-i18n-placeholder="write.ph_title" maxlength="100">

            <fieldset class="category-picker">
                <legend data-i18n="write.label_category"></legend>
                <div id="category-picker" class="category-chips"></div>
            </fieldset>

            <label for="content" data-i18n="write.label_content"></label>
            <textarea id="content" rows="14" data-i18n-placeholder="write.ph_content" maxlength="20000"></textarea>

            <label for="photo-input" data-i18n="write.label_photos"></label>
            <input type="file" id="photo-input" accept="image/png,image/jpeg,image/webp" multiple>
            <p class="field-hint" data-i18n="write.photos_hint"></p>
            <ul id="photo-list" class="photo-list"></ul>

            <label for="tags" data-i18n="write.label_tags"></label>
            <input type="text" id="tags" maxlength="1100" autocomplete="off" data-i18n-placeholder="write.ph_tags">

            <p id="draft-status" class="draft-status" role="status"></p>
            <div class="write-actions">
                <div id="draft-actions" class="draft-actions" hidden>
                    <button type="button" id="draft-save" class="secondary" data-i18n="draft.save"></button><button type="button" id="draft-count" class="secondary draft-count" aria-controls="draft-panel" aria-expanded="false"></button>
                </div>
                <button type="button" id="publish-btn" data-i18n="write.publish"></button>
            </div>
            <p id="write-message" class="form-message" role="status"></p>
        </form>
    </main>

    <footer>
                <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2" integrity="sha384-7i/4BYWz4Mn+lJfg2HWfEPfZQ7tmFKF3CTSKlXBpxWjNlLjcg+T6smpHG4gLmU1u" crossorigin="anonymous"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="nav.js"></script>
    <script src="categories.js"></script>
    <script src="render.js"></script>
    <script src="markdown.js"></script>
    <script src="editor.js"></script>
    <script src="image.js"></script>
    <script src="write.js"></script>
    <script src="write-note.js"></script>
    
</body>
</html>
